[calamares]
image=fedora:latest
home=/tmp/home
additional_packages="calamares"
volume="./system_files/etc/calamares:/run/calamares:ro,z ./system_files/usr/libexec/_calamares_bootcdeploy.sh:/usr/libexec/_calamares_bootcdeploy.sh:ro,z"
init_hooks="rm -rf /etc/calamares; ln -s /run/calamares /etc/calamares"
start_now=true
entry=false
